# nginx site for categor.io — see docs/DEPLOY.md.
# Install: cp deploy/nginx-categorio.conf /etc/nginx/sites-available/categorio
# certbot adds the HTTPS parts to this file itself.
server {
    listen 80;
    listen [::]:80;
    server_name categor.io www.categor.io 158.220.117.131;

    # Imports are limited to 8 MB by the site; leave a little room.
    client_max_body_size 9m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
